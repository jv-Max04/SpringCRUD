<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-4 text-center">Lista de tarefas</h1>

    <form id="form" class="card p-4 mb-4 shadow-sm">
      <div class="mb-3">
        <label for="titulo" class="form-label">Título da Tarefa:</label>
        <input type="text" class="form-control" name="titulo" id="titulo" placeholder="Ex: Comprar pão" required>
      </div>

      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição:</label>
        <input type="text" class="form-control" name="descricao" id="descricao" placeholder="Ex: Ir à padaria às 8h" required>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-primary">Enviar</button>
        <button type="button" id="cancel" class="btn btn-secondary" style="display: none;">Cancelar</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <caption class="text-center">Tarefas</caption>
        <thead class="table-dark">
           <tr>
            <th>Título</th>
            <th>Descrição</th>
            <th colspan="2">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-tarefas">
        </tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
